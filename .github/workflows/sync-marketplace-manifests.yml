name: Sync marketplace manifests

on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  sync:
    if: github.event_name != 'pull_request' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: marketplace-manifest-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Capture official version and live tools
        run: node scripts/sync-marketplace-manifests.mjs
      - name: Test the generated manifests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Create or update the draft sync PR
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: automation/marketplace-manifest-sync
          add-paths: |
            lhm.plugin.json
            plugin.json
            .cursor-plugin/plugin.json
          commit-message: Sync marketplace manifests with zSign MCP
          title: Sync marketplace manifests with zSign MCP
          body: |
            Sync marketplace versions and the LobeHub description with the latest official registry entry for `io.zsign/zsign`.
            Refresh the LobeHub tool catalog from `https://zsign.io/mcp/open`.
          draft: always-true
          delete-branch: true

  lobehub-publish-note:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'automation/marketplace-manifest-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record the manual publish step
        run: echo 'LobeHub publishing is manual. Run `lhm plugin update` after reviewing the merged manifest.' >> "$GITHUB_STEP_SUMMARY"
